name: jamiiclub
description: "The JamiiClub App."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  google_fonts: ^8.0.2
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  audioplayers: ^5.2.1 
  photo_manager: ^3.9.0
  video_player: ^2.6.0
  flutter_svg: ^2.2.3
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_core: ^4.5.0
  google_mlkit_translation: ^0.13.1
  dio: ^5.5.0+1
  flutter_image_compress: ^2.3.0
  video_compress: ^3.1.2
  path_provider: ^2.1.3
  image_picker: ^1.1.2
  shared_preferences: ^2.5.4
  rxdart: ^0.28.0
  camera: ^0.12.0+1
  uuid: ^4.5.3
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  rename: ^3.1.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#0D47A1"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/

  fonts:
    - family: LobsterTwo
      fonts:
        - asset: assets/fonts/LobsterTwo-Bold.ttf
          weight: 700
